openapi: 3.0.0
info:
  title: Coworking Monte Horebe API
  description: API para reserva de salas de coworking.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        tipo:
          type: string
          enum: [CLIENTE, ADM]
    Sala:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        atributos:
          type: string
        valor_hora:
          type: number
        imagem_url:
          type: string
    Reserva:
      type: object
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        sala_id:
          type: integer
        data:
          type: string
          format: date
        hora:
          type: integer
        valor:
          type: number
security:
  - bearerAuth: []
paths:
  /usuarios:
    post:
      summary: Cadastrar usuário
      description: Cria uma nova conta de cliente no sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
      responses:
        '201':
          description: Usuário criado com sucesso
        '400':
          description: Dados inválidos
        '409':
          description: Email já cadastrado
  /login:
    post:
      summary: Login de usuário
      description: Autentica um usuário existente e devolve um token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  token:
                    type: string
        '400':
          description: Email e senha são obrigatórios
        '401':
          description: Email ou senha inválidos
  /usuarios/{id}:
    get:
      summary: Obter perfil do usuário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do usuário
        '403':
          description: Sem permissão (não é o próprio usuário)
        '404':
          description: Usuário não encontrado
    put:
      summary: Editar usuário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Usuário atualizado
        '400':
          description: Dados inválidos
        '403':
          description: Sem permissão
        '404':
          description: Usuário não encontrado
    delete:
      summary: Excluir usuário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Usuário excluído com sucesso
        '403':
          description: Sem permissão
        '404':
          description: Usuário não encontrado
  /salas:
    get:
      summary: Listar salas
      security: []
      responses:
        '200':
          description: Lista de todas as salas
    post:
      summary: Criar sala
      description: Requer privilégios de ADM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, valor_hora]
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                atributos:
                  type: string
                valor_hora:
                  type: number
                imagem_url:
                  type: string
      responses:
        '201':
          description: Sala criada
        '400':
          description: Dados inválidos
        '403':
          description: Sem permissão (apenas ADM)
  /salas/{id}:
    get:
      summary: Obter detalhes da sala
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da sala
        '404':
          description: Sala não encontrada
    put:
      summary: Editar sala
      description: Requer privilégios de ADM.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                atributos:
                  type: string
                valor_hora:
                  type: number
                imagem_url:
                  type: string
      responses:
        '200':
          description: Sala atualizada
        '400':
          description: Dados inválidos
        '403':
          description: Sem permissão
        '404':
          description: Sala não encontrada
    delete:
      summary: Excluir sala
      description: Requer privilégios de ADM.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Sala excluída
        '403':
          description: Sem permissão
        '404':
          description: Sala não encontrada
        '409':
          description: Sala possui reservas futuras
  /salas/{id}/horarios:
    get:
      summary: Consultar horários livres
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: data
          required: true
          schema:
            type: string
            format: date
          description: Data no formato AAAA-MM-DD
      responses:
        '200':
          description: Lista de horários de 8 às 17 e suas disponibilidades
        '400':
          description: Formato de data inválido
        '404':
          description: Sala não encontrada
  /reservas:
    get:
      summary: Listar reservas
      description: Cliente vê suas próprias reservas. ADM vê todas e pode usar filtros.
      parameters:
        - in: query
          name: salaId
          schema:
            type: integer
        - in: query
          name: data
          schema:
            type: string
            format: date
        - in: query
          name: periodo
          schema:
            type: string
            enum: [proximas, historico]
      responses:
        '200':
          description: Lista de reservas (inclui nome da sala via JOIN)
        '401':
          description: Não autorizado
    post:
      summary: Criar reserva
      description: Requer privilégios de CLIENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salaId, data, hora]
              properties:
                salaId:
                  type: integer
                data:
                  type: string
                  format: date
                hora:
                  type: integer
      responses:
        '201':
          description: Reserva criada com sucesso
        '400':
          description: Dados ou horário inválidos
        '404':
          description: Sala não encontrada
        '409':
          description: Horário já reservado
  /reservas/{id}:
    delete:
      summary: Cancelar reserva
      description: Cliente só cancela a própria reserva. ADM pode cancelar qualquer uma. Somente reservas futuras.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Reserva cancelada
        '400':
          description: Não é possível cancelar reservas passadas
        '403':
          description: Sem permissão (não é dono da reserva nem ADM)
        '404':
          description: Reserva não encontrada
