openapi: 3.0.0
info:
  title: Coworking Monte Horebe API
  description: API para reserva de salas de coworking.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        tipo:
          type: string
          enum: [CLIENTE, ADM]
security:
  - bearerAuth: []
paths:
  /usuarios:
    post:
      summary: Cadastrar usuário
      description: Cria uma nova conta de cliente no sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
      responses:
        '201':
          description: Usuário criado com sucesso
        '400':
          description: Dados inválidos
        '409':
          description: Email já cadastrado
  /login:
    post:
      summary: Login de usuário
      description: Autentica um usuário existente e devolve um token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  token:
                    type: string
        '400':
          description: Email e senha são obrigatórios
        '401':
          description: Email ou senha inválidos
