openapi: 3.0.0
info:
  title: Coworking Monte Horebe API
  description: API para reserva de salas de coworking.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        tipo:
          type: string
          enum: [CLIENTE, ADM]
    UsuarioInput:
      type: object
      required: [nome, email]
      properties:
        nome:
          type: string
        email:
          type: string
security:
  - bearerAuth: []
paths:
  /usuarios:
    post:
      summary: Cadastrar usuário
      description: Cria uma nova conta de cliente no sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
      responses:
        '201':
          description: Usuário criado com sucesso
        '400':
          description: Dados inválidos
        '409':
          description: Email já cadastrado
  /login:
    /usuarios/{id}:
    get:
      summary: Buscar dados do próprio usuário
      description: Retorna os dados do usuário logado. Só o próprio usuário pode acessar.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário não tem permissão para acessar este recurso
        '404':
          description: Usuário não encontrado

    put:
      summary: Atualizar dados do próprio usuário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Dados inválidos
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário não tem permissão para editar este recurso
        '404':
          description: Usuário não encontrado
        '409':
          description: Email já usado por outro usuário

    delete:
      summary: Excluir a própria conta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Usuário excluído com sucesso
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário não tem permissão para excluir este recurso
        '404':
          description: Usuário não encontrado
    post:
      summary: Login de usuário
      description: Autentica um usuário existente e devolve um token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  token:
                    type: string
        '400':
          description: Email e senha são obrigatórios
        '401':
          description: Email ou senha inválidos
  /salas/{id}:
    get:
      summary: Detalhar sala
      description: Retorna os dados de uma sala. Não exige login.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              example: { "id": 1, "nome": "Sala A", "descricao": "Sala individual", "atributos": "Ar-condicionado, TV", "valor_hora": 25, "imagem_url": "/public/sala-individual-1.jpeg" }
        '404':
          description: Sala não encontrada

    put:
      summary: Editar sala
      description: Substitui os dados da sala. Apenas ADM. Mesmas validações da criação.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, valor_hora]
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                atributos:
                  type: string
                valor_hora:
                  type: number
                imagem_url:
                  type: string
            example: { "nome": "Sala B", "descricao": "Sala de reuniões", "atributos": "TV, 6 cadeiras", "valor_hora": 30, "imagem_url": "/public/sala-reunioes-1.jpeg" }
      responses:
        '200':
          description: Sala atualizada
        '400':
          description: Nome é obrigatório / Valor por hora deve ser um número maior que zero
        '401':
          description: Token ausente ou inválido
        '403':
          description: Apenas administradores podem editar salas
        '404':
          description: Sala não encontrada

    delete:
      summary: Excluir sala
      description: Exclui a sala. Apenas ADM. Não permite excluir sala com reservas a partir de hoje.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Sala excluída
        '401':
          description: Token ausente ou inválido
        '403':
          description: Apenas administradores podem excluir salas
        '404':
          description: Sala não encontrada
        '409':
          description: Não é possível excluir a sala, pois ela possui reservas futuras

  /reservas:
    get:
      summary: Consultar reservas e histórico
      description: >-
        Retorna as reservas em ordem crescente de data e hora.
        CLIENTE recebe somente as próprias reservas, futuras e passadas;
        os filtros são ignorados para clientes. ADM recebe todas as reservas
        e pode filtrar por sala, por data ou por ambos.
      security:
        - bearerAuth: []
      parameters:
        - name: sala_id
          in: query
          required: false
          description: ID da sala. Filtro exclusivo para ADM.
          schema:
            type: integer
            minimum: 1
          example: 2
        - name: data
          in: query
          required: false
          description: Data válida no formato AAAA-MM-DD. Filtro exclusivo para ADM.
          schema:
            type: string
            format: date
          example: '2099-12-31'
      responses:
        '200':
          description: Lista de reservas, incluindo o histórico
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    usuario_id:
                      type: integer
                    sala_id:
                      type: integer
                    data:
                      type: string
                      format: date
                    hora:
                      type: integer
                      minimum: 8
                      maximum: 17
                    valor:
                      type: number
                      description: Valor da hora registrado no momento da reserva.
                    sala_nome:
                      type: string
                    usuario_nome:
                      type: string
              example:
                - id: 7
                  usuario_id: 3
                  sala_id: 2
                  data: '2099-12-31'
                  hora: 9
                  valor: 80
                  sala_nome: Sala de Reuniões
                  usuario_nome: Ana
        '400':
          description: ID da sala ou data inválidos no filtro do ADM
          content:
            application/json:
              example:
                erro: Data inválida. Use o formato AAAA-MM-DD
        '401':
          description: Token ausente, inválido ou expirado, ou usuário autenticado inválido
          content:
            application/json:
              example:
                erro: Token não fornecido

  /reservas/{id}:
    delete:
      summary: Cancelar reserva futura
      description: >-
        CLIENTE pode cancelar somente a própria reserva; ADM pode cancelar
        a reserva de qualquer usuário. O início da reserva deve ser posterior
        ao momento do cancelamento, considerando o horário local do servidor.
        Reservas já iniciadas ou passadas são preservadas no histórico.
        O cancelamento exclui a reserva e libera o horário.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID da reserva a cancelar.
          schema:
            type: integer
            minimum: 1
          example: 7
      responses:
        '204':
          description: Reserva cancelada com sucesso. Resposta sem corpo.
        '400':
          description: ID da reserva inválido ou reserva já iniciada ou passada
          content:
            application/json:
              examples:
                idInvalido:
                  value:
                    erro: ID da reserva inválido
                reservaNaoFutura:
                  value:
                    erro: Somente reservas futuras podem ser canceladas
        '401':
          description: Token ausente, inválido ou expirado, ou usuário autenticado inválido
          content:
            application/json:
              example:
                erro: Token não fornecido
        '403':
          description: Cliente tentando cancelar a reserva de outro usuário
          content:
            application/json:
              example:
                erro: Você não tem permissão para cancelar esta reserva
        '404':
          description: Reserva não encontrada
          content:
            application/json:
              example:
                erro: Reserva não encontrada
